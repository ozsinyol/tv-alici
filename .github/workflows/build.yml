name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 yok: APK varsayilan debug anahtariyla imzalanir, release yayinlanmaz."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Imza parmak izini dogrula
        if: env.KEYSTORE_PATH != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "certificate SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          PIN=$(grep -o '[0-9a-f]\{64\}' app/build.gradle.kts | head -1)
          echo "APK imzasi : $APK_FP"
          echo "Uygulamadaki: $PIN"
          if [ "$APK_FP" != "$PIN" ]; then
            echo "::error::APK imzasi UPDATE_CERT_SHA256 ile uyusmuyor; uygulama bu guncellemeyi reddederdi."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tv-alici-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release (uygulama ici guncelleme bunu okur)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tv-alici.apk
          gh release create "v${{ github.run_number }}" tv-alici.apk \
            --title "v${{ github.run_number }}" \
            --notes "Otomatik derleme: ${{ github.sha }}" \
            --target "${{ github.sha }}"

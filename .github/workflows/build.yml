name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 is not set: the APK is signed with the default debug key and no GitHub Release is published."
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify signing certificate fingerprint
        if: env.KEYSTORE_PATH != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "certificate SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          PIN=$(grep -o '[0-9a-f]\{64\}' app/build.gradle.kts | head -1)
          echo "APK signature : $APK_FP"
          echo "Pinned in app : $PIN"
          if [ "$APK_FP" != "$PIN" ]; then
            echo "::error::APK signature does not match UPDATE_CERT_SHA256; the in-app updater would reject this update."
            exit 1
          fi

      - name: Verify the APK is not debuggable
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          if "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "application-debuggable"; then
            echo "::error::The release APK is debuggable; it must not be published."
            exit 1
          fi
          echo "APK is not debuggable."

      - uses: actions/upload-artifact@v4
        with:
          name: tv-alici-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish release (read by the in-app updater)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-alici.apk
          gh release create "v${{ github.run_number }}" tv-alici.apk \
            --title "v${{ github.run_number }}" \
            --notes "Signed release build of ${{ github.sha }}. Install with \`adb install tv-alici.apk\`, or let the app update itself (TV menu > Check for updates). Verified in CI: signing certificate matches the pinned fingerprint, APK is not debuggable." \
            --target "${{ github.sha }}"

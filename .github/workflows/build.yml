name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tv-alici-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release (uygulama ici guncelleme bunu okur)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tv-alici.apk
          gh release create "v${{ github.run_number }}" tv-alici.apk \
            --title "v${{ github.run_number }}" \
            --notes "Otomatik derleme: ${{ github.sha }}" \
            --target "${{ github.sha }}"
